name: Deploy Streamfinder to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'streamfinder/**'
      - '.github/workflows/deploy-streamfinder.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streamfinder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: streamfinder/package-lock.json

      - name: Install dependencies
        # Use 'npm install' instead of 'npm ci' to tolerate minor lock-file drift
        # across platforms (CI runner vs developer machines).
        run: npm install

      - name: Build
        env:
          # Set BASE_PATH to the GitHub Pages sub-path, e.g. /csfd
          # Override via repository variable STREAMFINDER_BASE_PATH if needed
          BASE_PATH: ${{ vars.STREAMFINDER_BASE_PATH || '' }}
          # Full origin for sitemap.xml absolute URLs, e.g. https://radozoo.github.io
          PUBLIC_SITE_URL: ${{ vars.STREAMFINDER_SITE_URL || 'https://radozoo.github.io' }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: streamfinder/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # Do NOT add `with: timeout:` here hoping for a longer wait. 600000 ms is a
        # hard maximum inside the action, not a default: a larger value is clamped
        # with "timeout value is greater than the allowed maximum" and changes
        # nothing. Verified on run 31111688437, which still aborted at 10:12.
        #
        # When Pages takes longer than that, the action *cancels* the deployment, so
        # the site keeps serving the previous build while main looks published. If
        # that starts happening regularly, the fix is fewer files in the artifact (we
        # publish one JSON per title) or creating the deployment through the Pages
        # API and polling it ourselves — not this input.
        uses: actions/deploy-pages@v4
