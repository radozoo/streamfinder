name: Deploy Streamfinder to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'streamfinder/**'
      - '.github/workflows/deploy-streamfinder.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streamfinder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: streamfinder/package-lock.json

      - name: Install dependencies
        # Use 'npm install' instead of 'npm ci' to tolerate minor lock-file drift
        # across platforms (CI runner vs developer machines).
        run: npm install

      - name: Build
        env:
          # Set BASE_PATH to the GitHub Pages sub-path, e.g. /csfd
          # Override via repository variable STREAMFINDER_BASE_PATH if needed
          BASE_PATH: ${{ vars.STREAMFINDER_BASE_PATH || '' }}
          # Full origin for sitemap.xml absolute URLs, e.g. https://radozoo.github.io
          PUBLIC_SITE_URL: ${{ vars.STREAMFINDER_SITE_URL || 'https://radozoo.github.io' }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: streamfinder/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # The action waits for Pages to finish publishing and gives up after 10
          # minutes by default — then *cancels* the deployment, so the site silently
          # keeps serving the previous build while the run shows a red X.
          #
          # We publish one JSON file per title (51k of them, ~110 MB), and Pages
          # publishes per file, so the wait scales with the file count, not the bytes.
          # The 1 Aug deploy of a 110.7 MB artifact finished in under a minute; two
          # runs of a 110.8 MB one both hit the wall at exactly 10:00, which is what
          # sitting just past the edge looks like.
          #
          # 30 minutes buys headroom without hiding a real hang: a genuinely stuck
          # deployment still fails, just later.
          timeout: 1800000
