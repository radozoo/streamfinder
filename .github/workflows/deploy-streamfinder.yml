name: Deploy Streamfinder to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'streamfinder/**'
      - '.github/workflows/deploy-streamfinder.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streamfinder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: streamfinder/package-lock.json

      - name: Install dependencies
        # Use 'npm install' instead of 'npm ci' to tolerate minor lock-file drift
        # across platforms (CI runner vs developer machines).
        run: npm install

      - name: Build
        env:
          # Set BASE_PATH to the GitHub Pages sub-path, e.g. /csfd
          # Override via repository variable STREAMFINDER_BASE_PATH if needed
          BASE_PATH: ${{ vars.STREAMFINDER_BASE_PATH || '' }}
          # Full origin for sitemap.xml absolute URLs, e.g. https://radozoo.github.io
          PUBLIC_SITE_URL: ${{ vars.STREAMFINDER_SITE_URL || 'https://radozoo.github.io' }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: streamfinder/build

  # Publishing this site is flaky on GitHub's side, so the deploy is retried.
  #
  # actions/deploy-pages waits for Pages to finish and gives up after 10 minutes,
  # and on timeout it *cancels* the deployment — the run goes red while the site
  # quietly keeps serving the previous build, which is the worst of both.
  #
  # The wait cannot be extended: 600000 ms is MAX_TIMEOUT inside the action (v4 and
  # v5 alike), and a larger `timeout:` input is clamped with "timeout value is
  # greater than the allowed maximum". Verified on run 31111688437, which still
  # aborted at 10:12 with the input set to 30 minutes. Do not try that again.
  #
  # Nor is the slowness ours to fix: the same ~110 MB artifact published in 21
  # seconds on 1 Aug and took 8m35s on 6 Aug, with 38 files' difference between
  # them. On 6 Aug three consecutive attempts hit the 10-minute wall and the fourth
  # succeeded, so retrying is what actually gets a deploy out.
  #
  # Each attempt is a fresh 10-minute window. Later attempts cost CI minutes only
  # on the bad days; on a good day the first one succeeds and the rest are skipped.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d1.outputs.page_url || steps.d2.outputs.page_url || steps.d3.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: d1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Retry deploy (2/3)
        id: d2
        if: steps.d1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # The last attempt does not swallow its failure, so a genuinely broken deploy
      # still turns the run red instead of passing silently.
      - name: Retry deploy (3/3)
        id: d3
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Report which attempt landed
        if: always()
        run: |
          echo "attempt 1: ${{ steps.d1.outcome }}"
          echo "attempt 2: ${{ steps.d2.outcome || 'skipped' }}"
          echo "attempt 3: ${{ steps.d3.outcome || 'skipped' }}"
